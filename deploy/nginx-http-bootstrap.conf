# Temporary HTTP-only site for the first certificate issuance.
# Replace parkick.example.com with the actual domain; it must resolve to this EC2 host.
server {
    listen 80;
    listen [::]:80;
    server_name parkick.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Do not expose the application over HTTP while HTTPS is being prepared.
    location / {
        return 503;
    }
}
