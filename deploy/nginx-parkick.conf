# Ubuntu: /etc/nginx/sites-available/parkick -> /etc/nginx/sites-enabled/parkick
# Replace every parkick.example.com with the actual HTTPS domain.
# This file belongs inside nginx's http context (Ubuntu's sites-enabled include).

# Deliberately excludes IP, URI/query strings, bodies, cookies, and authorization headers.
log_format parkick_minimal '$time_iso8601 $request_method $status $request_time $upstream_http_x_request_id';

server {
    listen 80;
    listen [::]:80;
    server_name parkick.example.com;
    access_log /var/log/nginx/parkick.access.log parkick_minimal;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://parkick.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name parkick.example.com;

    ssl_certificate /etc/letsencrypt/live/parkick.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkick.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ParkickTLS:10m;
    ssl_session_timeout 1d;

    root /srv/parkick/app/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 40m;
    client_body_timeout 60s;
    access_log /var/log/nginx/parkick.access.log parkick_minimal;
    error_log /var/log/nginx/parkick.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api {
        return 404;
    }

    location ^~ /api/ {
        # No trailing URI: keep the original /api/... path for Express.
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host parkick.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the single internet-facing proxy. Replace client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host parkick.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        # Preserve the browser's Origin header for the API's origin/CSRF check.
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        # Photo preparation, Bedrock validation, and report persistence can outlast 60s.
        # Match the browser's five-minute submission limit to avoid a proxy 504 after commit.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_cache off;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
